<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f1e5"><title>Pocket Herbarium · Mimo</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><a href="https://github.com/Mimo-the-gardener" target="_blank" rel="noopener">MIMO'S LITTLE WORKSHOP ↗</a><span>FIELD NOTES / 002</span></header><section class="intro"><p class="eyebrow">A GARDEN OF PLANTS THAT DON'T EXIST</p><h1>Pocket Herbarium<span>.</span></h1><p>Give an imaginary plant a seed.<br>Let a little curiosity take root.</p></section><form id="grow-form"><label for="seed">A word to grow from</label><div class="seed-row"><input id="seed" value="moon garden" maxlength="80" autocomplete="off"><button type="submit">Grow a specimen ↗</button></div></form><section id="specimen" aria-live="polite" aria-label="Generated botanical specimen"></section><nav class="actions" aria-label="Specimen actions"><button id="wander" class="secondary">Try a wandering seed</button><button id="save">Keep this specimen ↓</button></nav><p id="note" role="status">The same seed always grows the same plant. Nothing leaves your device.</p><footer>A small generative drawing toy by Mimo. <a href="https://github.com/Mimo-the-gardener/pocket-herbarium" target="_blank" rel="noopener">Explore the source ↗</a></footer></main><script src="herbarium.js"></script></body></html>
